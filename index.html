<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Lim — Product Designer</title>
<meta name="description" content="Kelly Lim is a product designer at Twilio, previously Stytch (acquired by Twilio), focused on identity, trust, and consent design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/daynight.js" defer></script>
<script src="assets/js/weather.js" defer></script>
<script src="assets/js/plants.js" defer></script>
</head>
<body>

  <section class="hero hero-full">
    <div class="hero-figure">
      <div class="hero-image-wrap">
        <img
          id="heroIllustration"
          class="hero-illustration"
          src="assets/illustration/windowsill-clear.webp?v=3"
          alt="Kelly's windowsill, empty of plants — they're layered on separately"
        >
        <img class="plant-lift-layer" id="plantLiftYellowKalanchoe" src="assets/illustration/plant-yellow-kalanchoe-clear.webp?v=2" alt="" aria-hidden="true">
        <img class="plant-lift-layer" id="plantLiftViolet" src="assets/illustration/plant-violet-clear.webp?v=2" alt="" aria-hidden="true">
        <img class="plant-lift-layer" id="plantLiftOrchid" src="assets/illustration/plant-orchid-clear.webp?v=2" alt="" aria-hidden="true">
        <img class="plant-lift-layer" id="plantLiftKalanchoe" src="assets/illustration/plant-kalanchoe-clear.webp?v=2" alt="" aria-hidden="true">
        <img
          class="plant-lift-layer"
          id="plantLiftFiddleFig"
          src="assets/illustration/plant-fiddle-fig-clear.webp?v=2"
          alt=""
          aria-hidden="true"
        >
        <button class="plant-hotspot" id="plantHotspotYellowKalanchoe" type="button" aria-label="See the yellow kalanchoe"></button>
        <button class="plant-hotspot" id="plantHotspotViolet" type="button" aria-label="See the African violet"></button>
        <button class="plant-hotspot" id="plantHotspotOrchid" type="button" aria-label="See the orchid"></button>
        <button class="plant-hotspot" id="plantHotspotKalanchoe" type="button" aria-label="See the kalanchoe"></button>
        <button
          class="plant-hotspot"
          id="plantHotspotFiddleFig"
          type="button"
          aria-label="See the fiddle-leaf fig"
        ></button>
        <div class="plant-info" id="plantInfo" hidden>
          <p class="plant-info-name" id="plantInfoName">Fiddle-leaf fig</p>
          <p class="plant-info-detail">Last watered — <span id="plantInfoWatered">3 days ago</span></p>
          <p class="plant-info-detail">Needs — <span id="plantInfoNeeds">bright, indirect light; water when the top inch of soil is dry</span></p>
        </div>
      </div>
      <button class="hero-caption" id="heroCaption" type="button">Kelly's window</button>
    </div>
    <div class="hero-copy">
      <p class="hero-blurb">
        <strong>Kelly</strong> is a product designer at <a href="https://twilio.com" target="_blank" rel="noopener noreferrer"><strong>Twilio</strong></a>,
        previously <a href="https://stytch.com" target="_blank" rel="noopener noreferrer"><strong>Stytch</strong></a> (acquired by Twilio).
        She currently lives in <strong>New York</strong><span id="weatherClause">.</span>
      </p>
    </div>
  </section>

  <section class="home-work">
    <h2 class="home-work-heading">Work</h2>
    <div class="home-work-list">
      <a class="home-work-link" href="agent-identity/case-study/">Agent Identity <span class="home-work-company">Twilio</span></a>
      <a class="home-work-link" href="stytch-sdk-integration-builder/case-study/">AuthKit: Integration Builder <span class="home-work-company">Stytch</span></a>
    </div>
  </section>

  <!-- temporary — testing aids, remove once signed off. Hidden from
       regular viewers; add ?debug=1 to the URL to reveal them. Each
       cycles through its options on click. See daynight.js / weather.js. -->
  <button id="dayNightToggle" class="debug-toggle daynight-toggle" type="button" hidden>Time: Day (click to cycle)</button>
  <button id="weatherToggle" class="debug-toggle weather-toggle" type="button" hidden>Weather: Clear (click to cycle)</button>

</body>
</html>
